name: release

# Pushing a tag like v2.6.0 builds the app, wraps it into an Inno Setup
# installer and publishes both the installer and a portable zip as a GitHub
# Release. The installer therefore always appears under "Releases".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the application
        run: python -m PyInstaller --noconfirm --clean MDViewer.spec

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Build the installer
        shell: pwsh
        run: |
          $ver = python -c "from version import APP_VERSION; print(APP_VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "installer\MDViewer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package the portable build
        shell: pwsh
        run: Compress-Archive -Path dist\MDViewer\* -DestinationPath dist\MDViewer-portable.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MDViewer-Setup-*.exe
            dist/MDViewer-portable.zip
          generate_release_notes: true
